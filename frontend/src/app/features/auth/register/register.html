    <div class="auth-card glass-card animate-scale">
      <div class="auth-header">
        <h1>Create account</h1>
        <p>Join BanglaFactGuard to track your verifications</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="register-full_name" class="form-label">Full Name</label>
          <input id="register-full_name" type="text" formControlName="full_name" class="form-control"
                 placeholder="Enter your full name" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email address</label>
          <input id="register-email" type="email" formControlName="email"
                 class="form-control"
                 [class.is-invalid]="emailInvalid"
                 placeholder="Enter your email" />
          @if (emailInvalid) {
            <span class="form-error">Valid email is required</span>
          }
        </div>

        <div class="form-group" formGroupName="passwords">
          <label for="register-password" class="form-label">Password</label>
          <input id="register-password" type="password" formControlName="password"
                 class="form-control"
                 [class.is-invalid]="pwInvalid"
                 placeholder="Enter a password" />
          @if (pwError) {
            <span class="form-error">{{ pwError }}</span>
          }
        </div>

        <div class="form-group" formGroupName="passwords">
          <label for="register-confirm" class="form-label">Confirm Password</label>
          <input id="register-confirm" type="password" formControlName="confirm"
                 class="form-control"
                 [class.is-invalid]="confirmInvalid"
                 placeholder="Re-enter your password" />
          @if (confirmInvalid) {
            <span class="form-error">Passwords do not match</span>
          }
        </div>

        @if (errorMsg) {
          <div class="alert-error" role="alert">{{ errorMsg }}</div>
        }

        <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="loading">
          @if (loading) { <span class="btn-spinner"></span> }
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a routerLink="/auth/login">Sign in</a>
      </p>
    </div>
