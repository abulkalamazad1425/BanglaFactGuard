# alembic.ini
# ============
# Alembic migration configuration for BanglaFactGuard.
#
# The `sqlalchemy.url` key is intentionally LEFT EMPTY here.
# It is set dynamically in `app/db/migrations/env.py` from
# the `get_settings().db.sync_url` value so that credentials
# never appear in version control.

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = app/db/migrations

# Template used to generate new migration file names
# %(year)d%(month).2d%(day).2d_%(hour).2d%(minute).2d_%(rev)s_%(slug)s.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path prepend for env.py imports
prepend_sys_path = .

# Maximum length for the slug portion of the migration filename
truncate_slug_length = 40

# Do not rewrite imports when generating/running migrations
# (required for SQLAlchemy 2.0 style)
revision_environment = false

# Use a single transaction for all DDL statements in a migration
transaction_per_migration = true

[post_write_hooks]
# Optionally run ruff format on generated migration files
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
