# docker-compose.redis.yml
# ==========================
# Redis-only compose file for BanglaFactGuard.
#
# PostgreSQL is NOT containerised — it uses the local installation.
# Only Redis is run in Docker here for caching purposes.
#
# Usage:
#   docker-compose -f docker-compose.redis.yml up -d
#
# Alternatively, if you have Redis installed locally, you can skip this and
# just start the Redis service:
#   Windows: redis-server (if installed via MSI / Chocolatey / Scoop)
#
# Redis connection settings match the .env defaults:
#   REDIS_HOST=localhost
#   REDIS_PORT=6379
#   REDIS_DB=0

services:
  redis:
    image: redis:7.2-alpine
    container_name: bgf_redis
    ports:
      - "6379:6379"
    volumes:
      - bgf_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bgf_redis_data:
    driver: local
