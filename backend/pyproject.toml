[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bangla-fact-guard"
version = "1.0.0"
description = "Multimodal Bangla Source-Based Fact Verification Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BanglaFactGuard Team" }
]
keywords = ["bangla", "fact-checking", "nlp", "fastapi", "disinformation"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Web framework ───────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ── Database ────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # ── Cache ───────────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.4",

    # ── HTTP client ─────────────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── ML / NLP ────────────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "transformers>=4.41.0",
    "torch>=2.3.0",
    "yake>=0.4.8",

    # ── Web scraping / extraction ───────────────────────────────────────
    "trafilatura>=1.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "readability-lxml>=0.8.1",
    "Levenshtein>=0.25.0",
    "feedparser>=6.0.11",
    "pygooglenews>=0.1.2",

    # ── Retry / resilience ──────────────────────────────────────────────
    "tenacity>=8.3.0",

    # ── Logging ─────────────────────────────────────────────────────────
    "structlog>=24.2.0",

    # ── Config ──────────────────────────────────────────────────────────
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # ── Validation ──────────────────────────────────────────────────────
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # AsyncClient in tests
    "factory-boy>=3.3.0",
    "faker>=25.4.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # FastAPI Depends() in default args
    "B904",     # raise from exc — many intentional re-raises
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml -v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "app/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
